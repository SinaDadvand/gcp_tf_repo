name: "Terraform Multi-Project CI/CD"

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'terraform_gcp/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'terraform_gcp/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: DYNAMICALLY SCAN FILESYSTEM FOR TERRAFORM PROJECTS
  # -------------------------------------------------------------
  detect-projects:
    name: "Detect Project Directories"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Discover Terraform Directories
        id: set-matrix
        run: |
          # Find all directories containing main.tf inside terraform_gcp/
          DIRS=$(find terraform_gcp -type f -name "main.tf" -exec dirname {} \; | sort -u)
          
          # Convert newline-separated paths into a JSON array: ["./terraform_gcp/np/adt/p-np-adt-landing", ...]
          JSON_ARRAY=$(echo "$DIRS" | jq -R . | jq -s -c .)
          
          echo "Discovered directories: $JSON_ARRAY"
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------
  # JOB 2: TERRAFORM PLAN (Runs across dynamically discovered matrix)
  # -------------------------------------------------------------
  plan:
    name: "Terraform Plan"
    needs: detect-projects
    if: ${{ needs.detect-projects.outputs.matrix != '[]' && needs.detect-projects.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        project_dir: ${{ fromJSON(needs.detect-projects.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.project_dir }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Post Plan to PR Comment
        if: github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          planfile: tfplan
          working-directory: ${{ matrix.project_dir }}
          header: "📝 Terraform Plan Output (`${{ matrix.project_dir }}`)"

  # -------------------------------------------------------------
  # JOB 3: TERRAFORM APPLY (Runs across dynamically discovered matrix)
  # -------------------------------------------------------------
  apply:
    name: "Terraform Apply"
    needs: [detect-projects, plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project_dir: ${{ fromJSON(needs.detect-projects.outputs.matrix) }}

    # Requires manual approval gate ONLY if applying changes under /pd/
    environment: ${{ startsWith(matrix.project_dir, 'terraform_gcp/pd/') && 'production' || '' }}

    defaults:
      run:
        working-directory: ${{ matrix.project_dir }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve